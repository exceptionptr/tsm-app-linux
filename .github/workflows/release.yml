name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── 1. Wheel, deb and rpm, with their smoke tests ─────────────────────────
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  # ── 2. Flatpak, AppImage and Nix ─────────────────────────────────────────
  # Defined in packaging.yml so the same builds also run on develop pushes.
  packaging:
    name: Packaging
    needs: build
    uses: ./.github/workflows/packaging.yml

  # ── 3. Create GitHub Release ─────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2.6.1
        with:
          name: "TSM App ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/wheel/*.whl
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/flatpak/*.flatpak
            artifacts/appimage/*.AppImage
