name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── 0. The tag is the source of truth for the version ────────────────────
  # The app reads its version from the tag through hatch-vcs, but the Nix flake,
  # the Flatpak manifest and the distribution changelogs cannot, so they carry
  # it themselves. A forgotten bump there is silent: nix run would report the
  # previous version. Fail the release instead.
  check-version:
    name: Check version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_version.py "${{ github.ref_name }}"
      # The release body is the CHANGELOG section, so a tag without notes fails
      # here, before anything is built.
      - run: python3 scripts/release_notes.py "${{ github.ref_name }}"

  # ── 1. Wheel, deb and rpm, with their smoke tests ─────────────────────────
  build:
    name: Build
    needs: check-version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  # ── 2. Flatpak, AppImage and Nix ─────────────────────────────────────────
  # Defined in packaging.yml so the same builds also run on develop pushes.
  packaging:
    name: Packaging
    needs: build
    uses: ./.github/workflows/packaging.yml

  # ── 3. Create GitHub Release ─────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "${{ github.ref_name }}" > release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2.6.1
        with:
          name: "TSM App ${{ github.ref_name }}"
          body_path: release-notes.md
          files: |
            artifacts/wheel/*.whl
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/flatpak/*.flatpak
            artifacts/appimage/*.AppImage

  # ── 4. Publish to the AUR ────────────────────────────────────────────────
  # The PKGBUILD downloads the tag's source tarball, so this runs only once the
  # GitHub release exists. Flathub stays a manual dispatch of flathub.yml: it
  # needs the app accepted there first (see docs/packaging.md).
  aur:
    name: AUR
    needs: github-release
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
